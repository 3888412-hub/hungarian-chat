<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Венгерский собеседник</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  .chat {
    width: 100%;
    max-width: 700px;
    height: 90vh;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header {
    background: #2e7d32;
    color: #fff;
    padding: 16px 20px;
    font-size: 18px;
    font-weight: 600;
  }
  .header small {
    display: block;
    font-weight: 400;
    font-size: 12px;
    opacity: 0.85;
    margin-top: 2px;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #2e7d32;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: #f1f3f4;
    color: #202124;
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: center;
    background: #fdecea;
    color: #c62828;
    font-size: 13px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #e0e0e0;
    background: #fafafa;
  }
  .input-row input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #dadce0;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
  }
  .input-row input:focus {
    border-color: #2e7d32;
  }
  .input-row button {
    background: #2e7d32;
    color: #fff;
    border: none;
    padding: 0 20px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .input-row button:disabled {
    background: #a5d6a7;
    cursor: not-allowed;
  }
  .typing {
    font-style: italic;
    opacity: 0.6;
  }
</style>
</head>
<body>
<div class="chat">
  <div class="header">
    Венгерский собеседник
    <small>Уровень A2–B1 · отвечай по-венгерски</small>
  </div>
  <div class="messages" id="messages">
    <div class="msg bot">Szia! Milyen napod volt? (Привет! Как прошёл твой день?)</div>
  </div>
  <div class="input-row">
    <input id="input" type="text" placeholder="Írd ide magyarul..." autocomplete="off">
    <button id="send">Küld</button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  let history = [];

  function addMessage(text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    inputEl.value = '';
    sendBtn.disabled = true;
    inputEl.disabled = true;

    const typing = addMessage('...', 'bot typing');

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history: history })
      });

      if (!res.ok) throw new Error('Ошибка сервера: ' + res.status);

      const data = await res.json();
      typing.remove();
      addMessage(data.reply, 'bot');

      history.push({ role: 'user', content: text });
      history.push({ role: 'assistant', content: data.reply });
    } catch (e) {
      typing.remove();
      addMessage('Ошибка: ' + e.message, 'error');
    } finally {
      sendBtn.disabled = false;
      inputEl.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') send();
  });
  inputEl.focus();
</script>
</body>
</html>
